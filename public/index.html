<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } } } }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900 min-h-screen flex flex-col">
  <div id="navbar"></div>
  <main class="flex-grow flex items-center justify-center p-6 text-center">
    <div class="max-w-2xl bg-white p-10 rounded-3xl shadow-xl shadow-brand-500/10 border border-slate-100">
      <div class="w-20 h-20 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"></path><circle cx="12" cy="12" r="10" stroke-width="2"></circle></svg>
      </div>
      <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">Plan Your Perfect Trip with AI</h1>
      <p class="text-lg text-slate-500 mb-8 max-w-xl mx-auto">Get personalized itineraries, hotel recommendations, and optimized routes in seconds. No more endless scrolling and planning.</p>
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="register.html" class="px-8 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-full transition shadow-lg shadow-brand-500/30">Get Started for Free</a>
        <a href="login.html" class="px-8 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-full transition">Log In</a>
      </div>
    </div>
  </main>
  <div id="chatbot"></div>

  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/components.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      document.getElementById('navbar').innerHTML = Components.renderNavbar();
      Components.initNavbar(user);
      document.getElementById('chatbot').innerHTML = Components.renderChatbot();
    });
  </script>
</body>
</html>
