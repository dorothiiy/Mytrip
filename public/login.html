<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AI Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } } } } }
  </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900 min-h-screen">
  <div id="navbar"></div>
  <main class="max-w-md mx-auto px-4 py-20">
    <div class="bg-white p-8 rounded-3xl shadow-xl shadow-brand-500/5 border border-slate-100 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-400 to-brand-600"></div>
      <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Welcome Back</h2>
      <p class="text-slate-500 mb-8 font-medium">Log in to view your planned trips.</p>
      
      <div id="errorMsg" class="hidden bg-red-50 text-red-600 p-4 rounded-xl text-sm font-semibold mb-6 border border-red-100"></div>
      
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
        </div>
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition shadow-lg shadow-brand-500/30 flex justify-center items-center">
          Log In
        </button>
      </form>
      <div class="mt-8 text-center text-sm font-medium text-slate-500">
        Don't have an account? <a href="register.html" class="text-brand-600 hover:text-brand-700 font-bold hover:underline">Sign up</a>
      </div>
    </div>
  </main>
  
  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/components.js?v=2"></script>
  <script>
    requireNoAuth();
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar').innerHTML = Components.renderNavbar();
      Components.initNavbar(null);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Logging in...';
      errorMsg.classList.add('hidden');

      try {
        await Auth.login(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Log In';
      }
    });
  </script>
</body>
</html>
