<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plan New Trip - AI Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } } } } }
  </script>
  <style>
    .autocomplete-list {
      position: absolute; width: 100%; z-index: 50; top: 100%; left: 0;
      background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 200px;
      overflow-y: auto; display: none;
    }
    .autocomplete-list.active { display: block; }
    .autocomplete-item {
      padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #f1f5f9;
    }
    .autocomplete-item:hover { background-color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900 min-h-screen">
  <div id="navbar"></div>
  <main class="max-w-3xl mx-auto px-4 py-12 relative">
    <div class="mb-10 text-center">
      <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Plan a New Trip</h1>
      <p class="text-slate-500 mt-2">Tell us about your dream vacation and AI will handle the rest.</p>
    </div>

    <div class="bg-white p-8 rounded-3xl shadow-xl shadow-brand-500/5 border border-slate-100">
      <div id="errorMsg" class="hidden bg-red-50 text-red-600 p-4 rounded-xl text-sm font-semibold mb-6 border border-red-100"></div>
      
      <form id="plannerForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="relative">
            <label class="block text-sm font-bold text-slate-700 mb-1.5">Origin</label>
            <input type="text" id="origin" required placeholder="e.g. New York, USA" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 transition">
            <div id="originAutocomplete" class="autocomplete-list"></div>
          </div>
          <div class="relative">
            <label class="block text-sm font-bold text-slate-700 mb-1.5">Destination</label>
            <input type="text" id="destination" required placeholder="e.g. Paris, France" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 transition">
            <div id="destAutocomplete" class="autocomplete-list"></div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">How many days?</label>
            <input type="number" id="days" min="1" max="14" required placeholder="1-14" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 transition">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">Budget</label>
            <select id="budget" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 transition text-slate-700">
              <option value="Budget">Budget</option>
              <option value="Moderate" selected>Moderate</option>
              <option value="Luxury">Luxury</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">Travel Type</label>
            <select id="travelType" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 transition text-slate-700">
              <option value="Car">Car / Drive</option>
              <option value="Flight" selected>Flight</option>
              <option value="Train">Train</option>
              <option value="Bus">Bus</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-3">Interests</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="sightseeing" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Sightseeing</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="food" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Food</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="shopping" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Shopping</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="trekking" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Trekking</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="museums" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Museums</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="nightlife" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Nightlife</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="beaches" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Beaches</span>
            </label>
            <label class="relative flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer bg-slate-50 hover:bg-brand-50 transition border-brand-100 peer-checked:bg-brand-100">
              <input type="checkbox" name="interests" value="photography" class="peer h-4 w-4 text-brand-600 focus:ring-brand-500 rounded border-slate-300">
              <span class="ml-2 text-sm font-medium text-slate-700 peer-checked:text-brand-700">Photography</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition shadow-lg shadow-brand-500/30 flex justify-center items-center text-lg mt-8">
          Generate Itinerary
        </button>
      </form>
    </div>

    <div id="aiLoading" class="hidden absolute inset-0 bg-slate-50/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center rounded-3xl">
      <div class="relative w-24 h-24">
        <div class="absolute inset-0 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin"></div>
        <div class="absolute inset-0 flex items-center justify-center text-3xl">🤖</div>
      </div>
      <h3 class="mt-6 text-2xl font-bold text-slate-900">AI is planning your trip...</h3>
      <p class="text-slate-500 mt-2">Checking weather, routes, and best attractions.</p>
    </div>
  </main>

  <script src="js/auth.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/components.js?v=2"></script>
  <script>
    // Nominatim Autocomplete
    let timeoutId;
    async function fetchNominatimData(query) {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`);
      return await res.json();
    }

    function setupAutocomplete(inputId) {
      const input = document.getElementById(inputId);
      const container = document.getElementById(inputId === 'origin' ? 'originAutocomplete' : 'destAutocomplete');
      
      input.addEventListener('input', (e) => {
        clearTimeout(timeoutId);
        container.classList.remove('active');
        const query = e.target.value.trim();
        if (query.length < 3) return;
        
        timeoutId = setTimeout(async () => {
          const results = await fetchNominatimData(query);
          if (results.length > 0) {
            container.innerHTML = results.map(r => `<div class="autocomplete-item text-sm">${r.display_name}</div>`).join('');
            container.querySelectorAll('.autocomplete-item').forEach(item => {
              item.addEventListener('click', () => {
                input.value = item.textContent;
                container.classList.remove('active');
              });
            });
            container.classList.add('active');
          }
        }, 500);
      });
      
      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !container.contains(e.target)) container.classList.remove('active');
      });
    }

    requireAuth();

    document.addEventListener('DOMContentLoaded', () => {
      setupAutocomplete('origin');
      setupAutocomplete('destination');
      const user = Auth.getUser();
      document.getElementById('navbar').innerHTML = Components.renderNavbar();
      Components.initNavbar(user);
    });

    const plannerForm = document.getElementById('plannerForm');
    const errorMsg = document.getElementById('errorMsg');
    const aiLoading = document.getElementById('aiLoading');

    plannerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const origin = document.getElementById('origin').value;
      const destination = document.getElementById('destination').value;
      const days = document.getElementById('days').value;
      const budget = document.getElementById('budget').value;
      const travelType = document.getElementById('travelType').value;
      
      const interestCheckboxes = document.querySelectorAll('input[name="interests"]:checked');
      const interests = Array.from(interestCheckboxes).map(cb => cb.value);

      if (interests.length === 0) {
        errorMsg.textContent = 'Please select at least one interest.';
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      aiLoading.classList.remove('hidden');

      try {
        const trip = await fetchAPI('/trips/generate', {
          method: 'POST',
          body: JSON.stringify({ origin, destination, days, budget, travelType, interests })
        });
        
        window.location.href = `plan.html?id=${trip._id}`;
      } catch (err) {
        aiLoading.classList.add('hidden');
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      }
    });

    // Check query params for duplication
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('from')) {
        // Mock duplication load (since we don't fetch trip data on this page without an API call)
    }
  </script>
</body>
</html>
