services:
  - type: web
    name: trip
    runtime: node
    # Repo root — do not set Root Directory to "src" in the dashboard.
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
